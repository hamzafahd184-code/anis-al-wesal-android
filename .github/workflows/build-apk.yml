name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare App Icon
        run: |
          mkdir -p app/src/main/res/drawable

          ICON=$(find app/src/main/res -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) | head -n 1)

          if [ -z "$ICON" ]; then
            echo "ERROR: No image found in app/src/main/res"
            exit 1
          fi

          cp "$ICON" app/src/main/res/drawable/app_icon.png

          sed -i 's|<application|<application android:icon="@drawable/app_icon"|' app/src/main/AndroidManifest.xml

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anis-al-wesal-apk
          path: app/build/outputs/apk/debug/app-debug.apk

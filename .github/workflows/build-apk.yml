name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare App Icon
        shell: bash
        run: |
          rm -f app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable

          ICON=$(find app/src/main/res -maxdepth 1 -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) \
            | head -n 1)

          if [ -z "$ICON" ]; then
            echo "ERROR: No image found"
            exit 1
          fi

          cp "$ICON" app/src/main/res/drawable/app_icon.png

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          if 'android:icon="@drawable/app_icon"' not in text:
              text = text.replace(
                  "<application",
                  '<application android:icon="@drawable/app_icon"',
                  1
              )

          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Build APK
        run: gradle assembleDebug

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: أنيس الوصال
          body: الإصدار الأول من تطبيق أنيس الوصال
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
